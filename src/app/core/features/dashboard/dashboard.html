<main class="dashboard">

    <header class="dashboard-header">
        <div class="logo">A</div>

        <button class="save-button" (click)="saveLayout()">
            Save Layout
        </button>
    </header>

    <section class="dashboard-toolbar">
        <select>
            <option>Dataset</option>
        </select>

        <select>
            <option>Last 90 days</option>
        </select>
    </section>

    <gridster [options]="gridOptions">

        @for (
        widget of store.visibleWidgets();
        track widget.id
        ) {

        <gridster-item [item]="widget">

            <div class="widget">

                @switch (widget.type) {

                @case ('stat') {
                <app-stat-widget [widget]="widget" />
                }

                @case ('chart') {
                <app-chart-widget [widget]="widget" />
                }

                @case ('table') {
                <app-table-widget />
                }

                }

            </div>

        </gridster-item>

        }

    </gridster>

</main>
